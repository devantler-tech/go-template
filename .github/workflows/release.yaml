name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@b0ee12726310db2df9494a7cf6f59f8006cdb5c6 # v21.3.5
    with:
      # Refuse every outbound host except the release jobs' measured allow-list
      # (devantler-tech/.github#912) — in this template repository only. Generated projects
      # own their release configuration (an asset upload needs another host), so they stay in
      # audit mode until they opt in themselves.
      block-egress: ${{ github.repository == 'devantler-tech/go-template' }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
