name: 🧱 Validate Scaffold

on:
  pull_request:
    branches: [main]

permissions: {}

# Template-repo-only scaffold-integrity gate for three non-Go surfaces:
#   * scripts/rename-placeholders.sh — the first thing a newcomer runs after
#     `Use this template`; a silent regression ships broken to every generated
#     project.
#   * .github/scripts/run-mockery.sh — the pre-commit `mockery` hook's entry
#     point; a regression makes every fresh clone's first commit fail.
#   * CLAUDE.md / GEMINI.md — exact one-line includes of canonical AGENTS.md;
#     copied guidance would create a second source that silently drifts.
# This job runs ONLY in the template repo; it no-ops in projects created from it
# (the guard below is false there), mirroring how cd.yaml/release.yaml run only
# downstream. Generated projects delete the onboarding script and gate their own
# code through whatever Go workflow their organisation injects (see AGENTS.md
# *Validation*) — this repo has no such injection.
jobs:
  validate-scaffold:
    name: Validate Scaffold
    if: github.repository == 'devantler-tech/go-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only job; never pushes
      - name: 🤖 Validate agent instruction shims
        run: sh scripts/validate-agent-shims.test.sh
      - name: Check Go language-version floor
        run: sh scripts/go-floor.test.sh
      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: 🧱 Validate onboarding (rename-placeholders.sh)
        run: sh scripts/rename-placeholders.test.sh
      - name: 🧪 Validate pre-commit mockery hook (run-mockery.sh)
        run: sh .github/scripts/run-mockery.test.sh
      # The replay below must run the catalogue revision todos.yaml calls. Read it
      # from that caller instead of repeating it here: a dependency update moves
      # only the `uses:` line, so a second copy goes stale and fails this job.
      - name: Resolve the reviewed TODO catalogue revision
        id: todo-catalogue
        run: |
          revision="$(sed -nE 's|^[[:space:]]*uses: devantler-tech/\.github/\.github/workflows/scan-for-todo-comments\.yaml@([0-9a-f]{40})([[:space:]].*)?$|\1|p' .github/workflows/todos.yaml)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::todos.yaml must call the canonical TODO workflow at exactly one full commit"
            exit 1
          }
          echo "revision=$revision" >>"$GITHUB_OUTPUT"
      - name: Checkout the reviewed TODO catalogue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: ${{ steps.todo-catalogue.outputs.revision }}
          path: .reviewed-todo-catalogue
          persist-credentials: false
      - name: Set up the reviewed catalogue test toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Scaffold checks above retain the template floor; this replay builds catalogue helpers.
          go-version-file: .reviewed-todo-catalogue/.github/tests/todo-scanner/go.mod
          cache: false
      - name: Verify native vendored comment filtering
        env:
          GOCACHE: ${{ runner.temp }}/todo-go-cache
          GOMODCACHE: ${{ runner.temp }}/todo-go-modules
        run: bash .github/scripts/verify-vendored-comment-scan.sh .reviewed-todo-catalogue
      - name: Validate shell pipelines
        id: shell-pipelines
        uses: devantler-tech/.github/actions/validate-shell-pipelines@ef34177c48310d4e8d6605233cb7218b926dcc55 # v7.2.11
        with:
          paths: |
            scripts
            .github/scripts
      - name: Require a complete shell scan
        env:
          VALIDATED: ${{ steps.shell-pipelines.outputs.validated }}
        run: |
          if [ "$VALIDATED" != true ]; then
            echo "::error::The shell scan did not complete; require enforcement and repair the reported scope or finding."
            exit 1
          fi
