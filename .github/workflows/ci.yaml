---
name: CI

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  required-checks:
    name: CI - Required Checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Require checks in PR
        uses: devantler-tech/.github/actions/aggregate-job-checks@8e2be219f866ab1a7e7b2c90a7c52542ca1a4cb6 # v2.5.6
        with:
          job-results: ""
