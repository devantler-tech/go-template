    name: CI - Required Checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Require checks in PR
        uses: devantler-tech/actions/aggregate-job-checks@f8672a9111aeb957224fb969636b78a97471e0ec # v9.0.3
        with:
          job-results: ""
