---
name: CI

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  required-checks:
    name: CI - Required Checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Require checks in PR
        uses: devantler-tech/actions/aggregate-job-checks@7a19c1d0f32e5a99a38d0a4106f1b2cbd76c99e4 # v13.6.7
        with:
          job-results: ""
