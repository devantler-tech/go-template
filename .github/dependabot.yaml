version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
      # devantler-tech Go modules are our own code — bump now, no cooldown.
      exclude:
        - "github.com/devantler-tech/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
    groups:
      # One pull request for every devantler-tech action and workflow pin, instead of one per
      # pin (devantler-tech/.github#928). Security updates are not grouped by this entry.
      devantler-tech:
        patterns:
          - "devantler-tech/*"
